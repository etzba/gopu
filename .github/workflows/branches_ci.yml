name: Branches CI pipeline

on:
  push:
    branches:
      - "*"
  pull_request:

jobs:
  test:
    name: Run unit tests on ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Running Tests
        run: |
          go mod tidy
          make test

  go-build:
    name: Build app on ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build app
        env:
          CGO_ENABLED: 0 
          GOOS: linux 
          GOARCH: amd64
        run: |
          go build -a -o app main.go

  lint:
    name: Run golangci linter on ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run linter
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.10.0

  build-container:
    name: Build and push container image
    needs: [test, go-build] 
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Extract branch name
        shell: bash
        run: echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT
        id: extract_branch

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.11.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3.4.0
        with:
          registry: ghcr.io
          username: etzba
          password: ${{ secrets.ghcrToken }}

      - id: docker_meta
        uses: docker/metadata-action@v5.7.0
        with:
          images: ghcr.io/sigstore/sample-honk
          tags: type=sha,format=long

      - name: Build and Push container images
        uses: docker/build-push-action@v7
        id: build-and-push
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.extract_tag.outputs.tag }}
          builder: ${{ steps.buildx.outputs.name }}
          file: ./Dockerfile
          platforms: linux/amd64
          labels: |
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.description=${{ github.event.repository.description }}
            org.opencontainers.image.url=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ steps.extract_tag.outputs.tag }}
            org.opencontainers.image.version=${{ env.VERSION }}

      - name: Publish container image to ghcr.io
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }} , ghcr.io/${{ github.repository }}:${{ steps.extract_branch.outputs.branch }}
          builder: ${{ steps.buildx.outputs.name }}
          file: ./Dockerfile
          platforms: linux/amd64
          labels: |
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.description=${{ github.event.repository.description }}
            org.opencontainers.image.url=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}

      - name: sign container image
        run: |
            echo '${{ secrets.COSIGN_KEY }}' > cosign.key
            cosign sign --key cosign.key ghcr.io/${{ github.repository }}:${{ github.sha }}
        shell: bash
        env:
          COSIGN_KEY: |
            ${{secrets.COSIGN_KEY}}
          COSIGN_PASSWORD: ""

      - name: Check images
        run: |
          docker buildx imagetools inspect ghcr.io/${{ github.repository }}:${{ steps.extract_tag.outputs.tag }}
          docker pull ghcr.io/${{ github.repository }}:${{ steps.extract_tag.outputs.tag }}
          echo '${{ secrets.COSIGN_PUBLIC_KEY }}' > cosign.pub
          cosign verify --key cosign.pub ghcr.io/${{ github.repository }}:${{ steps.extract_tag.outputs.tag }}

      - name: Log in to docker hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: etzba
          password: ${{ secrets.dockerHubToken }}
          
      - name: Inspect images with buildx and verify cosign signature with public key
        run: |
          docker buildx imagetools inspect ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker pull ghcr.io/${{ github.repository }}:${{ github.sha }}
          echo '${{ secrets.COSIGN_PUBLIC_KEY }}' > cosign.pub
          cosign verify --key cosign.pub ghcr.io/${{ github.repository }}:${{ github.sha }}
 